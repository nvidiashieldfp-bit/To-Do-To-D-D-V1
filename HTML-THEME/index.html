<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>To-Do To-Did — Standalone Pro</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- FIX: Tailwind Config must run BEFORE the CDN script -->
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        'comfort-light': 'var(--app-bg)',
                        'comfort-panel': 'var(--card-bg)',
                        'comfort-surface': 'var(--surface-bg)',
                        'comfort-text': 'var(--app-text)',
                        'comfort-border': 'var(--border-color)',
                        'comfort-accent': 'var(--p-accent)',
                    }
                }
            }
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body>
    <!-- SCRIPT CRÍTICO: Executa antes do layout para garantir Tema e Estado corretos -->
    <script>
        (function() {
            try {
                var saved = null;
                try { saved = localStorage.getItem('todo_to_did_v1'); } catch(e) {}
                if (saved) {
                    var state = JSON.parse(saved);
                    if (state.theme === 'dark' || state.theme === 'night') {
                        document.documentElement.classList.add('dark');
                    }
                    if (state.showLanding === false) {
                        var style = document.createElement('style');
                        style.innerHTML = '#landing-screen { display: none !important; }';
                        document.head.appendChild(style);
                    }
                } else if (window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    document.documentElement.classList.add('dark');
                }
            } catch(e) { console.error('Render script error', e); }
        })();
    </script>

    <!-- Focus Mode Overlay (Hidden by default) -->
    <div id="focus-overlay" class="hidden">
        <div class="focus-container">
            <div class="focus-label" id="focus-label">FOCUS MODE</div>
            <div class="focus-timer" id="focus-timer">25:00</div>
            <button id="btn-stop-focus">STOP</button>
        </div>
    </div>

    <!-- Ecrã de Entrada (Landing Page) -->
    <div id="landing-screen" class="landing-overlay">
        <div class="landing-scroll-container">
            <section class="landing-hero">
                <div class="landing-hero-content">
                    <h1 class="landing-title">To-Do To-Did</h1>
                    <p class="landing-tagline">Menos planeamento. Mais ação.</p>
                    <p class="landing-subtitle">Um gestor de tarefas calmo e rápido que não atrapalha.</p>
                    <button id="btn-open-app" class="landing-btn">Abrir a aplicação</button>
                </div>
            </section>
            <!-- (Conteúdo Landing mantido igual, simplificado para output) -->
             <div class="landing-sections-wrapper">
                <section class="landing-section">
                    <h3 class="landing-section-title" data-i18n="landing_what_title">O QUE É ISTO?</h3>
                    <div class="landing-text-block">
                        <p data-i18n="landing_what_p1">Um gestor de tarefas feito para quem detesta gerir tarefas.</p>
                        <ul class="landing-list" data-i18n-list="landing_what_list"></ul>
                        <p class="highlight-text" data-i18n="landing_what_p2">Basta escrever.</p>
                    </div>
                </section>
                <footer class="landing-footer">
                    <p class="footer-motto" data-i18n="landing_footer">Foco. Eficiência. Clareza.</p>
                </footer>
            </div>
        </div>
    </div>

    <!-- Aplicação Principal -->
    <div id="app" class="container">
        <header>
            <div class="brand">
                <h1 id="brand-logo" style="cursor: pointer">To-Do To-Did</h1>
                <p id="tagline"></p>
            </div>
            <div class="controls">
                <button id="toggle-theme" title="Tema">🌓</button>
                <button id="toggle-view" title="Vista">📅</button>
            </div>
        </header>

        <form id="task-form" class="input-group">
            <button type="button" id="form-priority" class="priority-bar MEDIUM" title="Prioridade"></button>
            <input type="text" id="task-input" autocomplete="off" spellcheck="false">
        </form>

        <div id="list-view" class="view active">
            <!-- As secções agora têm funcionalidade de toggle via JS -->
            <div class="section" data-type="NOW">
                <button class="section-header"><span></span><span class="count">0</span></button>
                <div class="tasks"></div>
            </div>
            <div class="section" data-type="TODAY">
                <button class="section-header"><span></span><span class="count">0</span></button>
                <div class="tasks"></div>
            </div>
            <div class="section" data-type="TOMORROW">
                <button class="section-header"><span></span><span class="count">0</span></button>
                <div class="tasks"></div>
            </div>
            <div class="section" data-type="FUTURE">
                <button class="section-header"><span></span><span class="count">0</span></button>
                <div class="tasks"></div>
            </div>
            <div class="section" data-type="DID">
                <button class="section-header"><span></span><span class="count">0</span></button>
                <div class="tasks"></div>
            </div>
        </div>

        <div id="calendar-view" class="view">
            <div class="calendar-header">
                <div class="nav">
                    <button id="prev-nav" class="nav-btn">◀️</button>
                    <button id="next-nav" class="nav-btn">▶️</button>
                    <h2 id="current-period-label"></h2>
                </div>
                <div class="view-selector">
                    <button id="view-week">SEMANA</button>
                    <button id="view-month" class="active">MÊS</button>
                </div>
            </div>
            <div id="calendar-container">
                <div id="calendar-grid"></div>
            </div>
        </div>

        <div id="mantra-container" class="mantra-wrapper">
            <p id="dynamic-mantra"></p>
        </div>

        <footer id="footer">
            <div class="footer-logo">
                <span>TD <script>document.write(new Date().getFullYear())</script> · To-Do To-Did</span>
            </div>
            <div class="footer-info">
                <span id="footer-date"></span> · <span id="footer-time"></span>
            </div>
        </footer>
    </div>
    
    <script src="jquery.js"></script>
    <script src="javascript.js"></script>
</body>
</html>
